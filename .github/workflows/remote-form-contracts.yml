name: Remote Form public API contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-form-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  remote-contracts-browser:
    name: Remote Form contracts browser
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Frozen workspace install
        run: bash scripts/bootstrap.sh
      - name: Build public library
        run: pnpm --filter @sveltery/base build
      - name: Actual packed public consumer and explicit Kit patch setup
        run: bash scripts/check-remote-form-contracts-package.sh
      - name: Install official secured Chromium
        id: chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Measure public developer experience contracts first
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: .checks/remote-contracts/contracts-results.json
        run: |
          set -o pipefail
          mkdir -p .checks/remote-contracts
          pnpm exec playwright test tests/browser/remote-form-api-contracts.spec.ts --output=.checks/remote-contracts/first-results --reporter=list,json | tee .checks/remote-contracts/contracts.log
      - name: Entire current remote suite and public developer experience contracts
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: .checks/remote-contracts/browser-results.json
        run: |
          set -o pipefail
          mkdir -p .checks/remote-contracts
          pnpm exec playwright test tests/browser/field-form-remote.spec.ts tests/browser/remote-form-api.spec.ts tests/browser/remote-form-api-contracts.spec.ts tests/browser/remote-native-propagation.spec.ts --reporter=list,json | tee .checks/remote-contracts/browser.log
      - name: Preserve actual JSON observations and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remote-form-contracts-browser-evidence
          path: |
            .checks/remote-contracts/
            test-results/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
