name: Remote form types

on:
  pull_request:
    paths:
      - packages/base/src/lib/**
      - apps/fixtures/src/lib/remote-form.types.ts
      - scripts/check-remote-form-types.sh
      - scripts/fixtures/remote-form-types/**
      - .github/workflows/remote-form-types.yml
      - pnpm-lock.yaml
  push:
    branches: [main]
    paths:
      - packages/base/src/lib/**
      - apps/fixtures/src/lib/remote-form.types.ts
      - scripts/check-remote-form-types.sh
      - scripts/fixtures/remote-form-types/**
      - .github/workflows/remote-form-types.yml
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  types:
    name: Remote form types (Kit ${{ matrix.kit }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kit: ['2.70.3', '3.0.0']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Frozen workspace install
        run: bash scripts/bootstrap.sh
      - name: Build library declarations
        run: pnpm --filter @sveltery/base build
      - name: Packed public field types and intentional negative consumers
        run: bash scripts/check-remote-form-types.sh --public '${{ matrix.kit }}'
