name: Radio source acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  radio-browser:
    name: Radio browser
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Frozen workspace install
        run: bash scripts/bootstrap.sh
      - name: Build actual library
        run: pnpm --filter @sveltery/base build
      - name: Install official secured Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Exact React 19.2.8 and Svelte Radio source acceptance
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: .checks/radio/browser-results.json
        run: |
          set -o pipefail
          mkdir -p .checks/radio
          pnpm exec playwright test tests/browser/radio.spec.ts tests/browser/radio-native-composite-lifecycle.spec.ts --reporter=list,json 2>&1 | tee .checks/radio/browser.log
      - name: Preserve actual Radio JSON observations and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: radio-browser-evidence
          path: |
            .checks/radio/
            test-results/
          if-no-files-found: warn
          retention-days: 14
