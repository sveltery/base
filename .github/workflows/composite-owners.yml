name: Composite owners packed consumer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: composite-owners-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  composite-owners-package:
    name: Composite owners strict packed SSR and hydration
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Frozen workspace install
        run: bash scripts/bootstrap.sh
      - name: Immutable Source and actual native Composite ref witnesses
        run: node --conditions=browser --import ./scripts/composite-recovery-loader.mjs ./scripts/check-composite-recovery.mjs
      - name: Build actual library and check isolated public package
        run: |
          pnpm --filter @sveltery/base build
          set -o pipefail
          mkdir -p .checks/composite-owners
          bash scripts/check-composite-owners-package.sh 2>&1 | tee .checks/composite-owners/packed-consumer.log
      - name: Preserve raw packed consumer receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: composite-owners-packed-evidence
          path: .checks/composite-owners/
          if-no-files-found: warn
          retention-days: 14
