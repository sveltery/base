name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Defaults are opened, synchronize, and reopened. ready_for_review is
    # required so marking a draft ready starts CI without a new commit.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  types:
    name: Types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm check

  unit:
    name: Unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  package:
    name: Package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run build

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Fails when a section index page is stale. It runs first, because a build rewrites them.
      - run: pnpm docs:validate
      - run: pnpm --filter @sveltery/base-docs test
      # Builds the site, validates its prerendered HTML, then type-checks it and every demo.
      - run: pnpm --filter @sveltery/base-docs check

  # Both browser suites are CPU-bound on a 4-vCPU runner, so they split across runners.
  component:
    name: Component (${{ matrix.shard }}/3)
    # Chromium's sandbox needs unprivileged user namespaces, which 24.04 runners restrict.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: true
      - run: pnpm test:component --shard=${{ matrix.shard }}/3

  e2e:
    name: E2E (${{ matrix.shard }}/3)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: true
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/3
      - name: Keep traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

  # Browser behavior the components rely on, checked in Firefox and WebKit too.
  engines:
    name: Engines
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: true
          browsers: firefox webkit
      - run: pnpm test:e2e:engines
      - name: Keep traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engines-traces
          path: test-results/
          if-no-files-found: ignore
