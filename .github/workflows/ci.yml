          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Frozen workspace install
        run: bash scripts/bootstrap.sh
      - name: Build actual component library
        run: pnpm --filter @sveltery/base build
      - name: Install official Chromium and OS dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Paired exact-pin Collapsible acceptance
        # A failing run stops early for diagnosis; a passing run executes every case.
        run: pnpm exec playwright test tests/browser/collapsible.spec.ts --max-failures=5
      - name: Preserve Collapsible browser failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
