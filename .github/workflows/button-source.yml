name: Button source acceptance

on:
  pull_request:
    paths:
      - packages/base/src/lib/**
      - parity/button/**
      - apps/fixtures/src/lib/*Button*
      - apps/fixtures/src/lib/button-*
      - apps/fixtures/src/routes/button*/**
      - tests/browser/button*.spec.ts
      - packages/base/tests/*button*
      - packages/base/tests/dom/button*.test.ts
      - scripts/check-button-package.sh
      - .github/workflows/button-source.yml
  push:
    branches: [main]
    paths:
      - packages/base/src/lib/**
      - parity/button/**
      - apps/fixtures/src/lib/*Button*
      - apps/fixtures/src/lib/button-*
      - apps/fixtures/src/routes/button*/**
      - tests/browser/button*.spec.ts
      - packages/base/tests/*button*
      - packages/base/tests/dom/button*.test.ts
      - scripts/check-button-package.sh
      - .github/workflows/button-source.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: button-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  button-source:
    name: Button source and browser
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: mui/base-ui
          ref: 47b40521eab921c2756bf9bdb0b0f07fbfdb8c8c
          path: .checks/button/upstream
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Frozen workspace install
        run: bash scripts/bootstrap.sh
      - name: Verify original immutable assertions and complete original/native source graphs
        run: |
          node parity/button/inventory.mjs .checks/button/upstream --check
          node parity/button/graph.mjs .checks/button/upstream --check
      - name: Build actual library and verify strict isolated public root/subpath consumers
        run: |
          pnpm --filter @sveltery/base build
          bash scripts/check-button-package.sh
      - name: Install official secured Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Actual React 19.2.8 and native Button source acceptance
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: .checks/button/browser-results.json
        run: |
          set -o pipefail
          pnpm exec playwright test tests/browser/button.spec.ts tests/browser/button-source.spec.ts --reporter=list,json | tee .checks/button/browser.log
      - name: Preserve Button source execution and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: button-source-evidence
          path: |
            .checks/button/browser-results.json
            .checks/button/browser.log
            test-results/button*/
          if-no-files-found: warn
          retention-days: 14
