name: Kit submit compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Kit submit compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Frozen patched workspace install
        run: bash scripts/bootstrap.sh
      - name: Check exact SDK patch and package boundary
        run: node --test scripts/tests/kit-submit-patch.test.mjs
      - name: Build actual source-derived Field and Form
        run: pnpm --filter @sveltery/base build
      - name: Install official Chromium and OS dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Secured SDK-boundary acceptance
        run: pnpm exec playwright test tests/browser/kit-submit-compat.spec.ts tests/browser/kit-reset-compat.spec.ts
      - name: Preserve browser failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kit-submit-compatibility-failures
          path: |
            test-results/kit-submit-compat-*/
            test-results/kit-reset-compat-*/
          if-no-files-found: warn
          retention-days: 14
  unpatched-witness:
    name: Kit unpatched witness
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare isolated unchanged SDK negative control
        run: node scripts/prepare-kit-unpatched-witness.mjs "$GITHUB_WORKSPACE"
      - name: Frozen unpatched workspace install
        run: bash scripts/bootstrap.sh
      - name: Verify original immutable SDK source
        run: >-
          node --input-type=module -e
          "import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const source=readFileSync('apps/fixtures/node_modules/@sveltejs/kit/src/runtime/client/remote-functions/form.svelte.js');
          assert.equal(createHash('sha256').update(source).digest('hex'),'40ef548ea4da3e79a305ae25113506f1e019c4a7ef78d526c69dea23ee440401');"
      - name: Build identical Field and Form components
        run: pnpm --filter @sveltery/base build
      - name: Install official Chromium and OS dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Witness original submit cancellation and native reset behavior
        env:
          KIT_SUBMIT_EXPECT_UNPATCHED: '1'
        run: pnpm exec playwright test tests/browser/kit-submit-compat.spec.ts tests/browser/kit-reset-compat.spec.ts
      - name: Preserve witness failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kit-unpatched-witness-failures
          path: |
            test-results/kit-submit-compat-*/
            test-results/kit-reset-compat-*/
          if-no-files-found: warn
          retention-days: 14
