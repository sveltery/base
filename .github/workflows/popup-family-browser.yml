name: Popup family Source browser

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  popup-family-browser:
    name: Popup family Source browser
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Frozen workspace install
        run: bash scripts/bootstrap.sh
      - name: Build actual Popup family library
        run: pnpm --filter @sveltery/base build
      - name: Install official Chromium and OS dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Actual Original React and native Svelte Popup family pairs
        run: pnpm exec playwright test --config playwright.popup-family.config.ts
      - name: Preserve raw results and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: popup-family-source-browser
          path: |
            test-results/popup-family-results.json
            test-results/popup-family/
          if-no-files-found: warn
          retention-days: 14
