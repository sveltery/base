name: NumberField source acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: number-field-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  number-field-browser:
    name: NumberField browser
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/sveltery-number-field-chromium
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Frozen workspace install
        run: bash scripts/bootstrap.sh
      - name: Check out the immutable original source closure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: mui/base-ui
          ref: 47b40521eab921c2756bf9bdb0b0f07fbfdb8c8c
          path: .checks/number-field/upstream
          persist-credentials: false
      - name: Verify complete source and assertion hashes with exact installed references
        run: |
          node parity/number-field/verify-source.mjs .checks/number-field/upstream
          node parity/number-field/native-integration-graph.mjs --check
      - name: Build actual library
        run: pnpm --filter @sveltery/base build
      - name: Installed public root and NumberField subpath consumer
        run: bash scripts/check-number-field-package.sh
      - name: Install official secured Chromium
        id: secured-chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Causal native predecessor red and mandatory current NumberField acceptance
        run: bash scripts/check-number-field-stepper-owner-browser.sh
      - name: Exact-pin and current provider source-bug witnesses
        if: always() && steps.secured-chromium.outcome == 'success'
        run: |
          source scripts/toolchain.sh
          export NODE_OPTIONS="--max-old-space-size=1024"
          node scripts/number-field-stepper-owner-browser.mjs verify-current unused .checks/number-field/stepper-owner-paired
          set +e
          PLAYWRIGHT_JSON_OUTPUT_NAME=.checks/number-field/source-bug-results.json pnpm exec playwright test tests/browser/number-field-source-bugs.spec.ts --output=.checks/number-field/source-bug-traces --reporter=list,json 2>&1 | tee .checks/number-field/source-bug-browser.log
          proof_status=("${PIPESTATUS[@]}")
          set -e
          if [[ "${proof_status[1]}" -ne 0 ]]; then exit 1; fi
          exit "${proof_status[0]}"
      - name: Preserve actual NumberField observations and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: number-field-browser-evidence
          path: |
            .checks/number-field/
            test-results/number-field-*/
          if-no-files-found: warn
          retention-days: 14
